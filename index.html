<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina de agentes IA</title>
<style>
:root{--bg:#eef2f8;--panel:#ffffff;--panel2:#f4f7fb;--line:#dde4ef;--tx:#1b2438;--mut:#6b7790;--acc:#3b7bff;--ok:#16a679;--warn:#c98a00;--bad:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em}
.tag{font-weight:600;font-size:11.5px;color:var(--acc);margin-left:8px;padding:2px 8px;background:#e8f0ff;border-radius:99px}
#chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.chip b{color:var(--tx)}
main{display:grid;grid-template-columns:1fr 390px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;background:linear-gradient(#cfe3f7,#eaf3fb 55%,#e4f1df)}
canvas#cv{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#cv:active{cursor:grabbing}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
#status{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(30,50,90,.12)}
#status.on{color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer;box-shadow:0 1px 4px rgba(30,50,90,.08)}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;border-radius:10px}
button:disabled{opacity:.5;cursor:default}
.hint{position:absolute;bottom:92px;left:12px;font-size:12px;color:#51607e;background:rgba(255,255,255,.72);padding:2px 8px;border-radius:99px;pointer-events:none}
/* barra de agentes */
#roster{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;align-items:stretch}
.rtasks{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:64px;background:rgba(255,255,255,.95);border-radius:14px;padding:4px 10px;box-shadow:0 2px 8px rgba(30,50,90,.14)}
.rtasks b{font-size:20px;line-height:1}.rtasks span{font-size:11px;color:var(--mut)}
.rc{flex:none;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.96);border-radius:14px;padding:6px 12px 6px 6px;border:2px solid transparent;cursor:pointer;min-width:158px;box-shadow:0 2px 8px rgba(30,50,90,.14);position:relative}
.rc:hover{border-color:#b9cdf5}.rc.sel{border-color:var(--acc);background:#f2f7ff}
.rc canvas{width:46px;height:46px;border-radius:50%;background:#e8eefb;flex:none}
.rc .nm{font-weight:800;line-height:1.1}.rc .ro{font-size:11.5px;color:var(--mut);line-height:1.2}
.rc .ln{display:flex;align-items:center;gap:6px;margin-top:3px}
.pchip{font-size:10px;font-weight:800;color:#fff;border-radius:6px;padding:1px 6px;letter-spacing:.02em}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}
.rc .tk{font-size:11px;color:var(--mut)}
/* tarjeta de detalle */
#detail{position:absolute;top:54px;right:12px;width:318px;max-height:calc(100% - 170px);overflow:auto;background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(30,50,90,.22);padding:14px;display:none;flex-direction:column;gap:10px}
#detail.on{display:flex}
#detail .hd{display:flex;gap:10px;align-items:center}
#detail .hd canvas{width:58px;height:58px;border-radius:50%;background:#e8eefb;flex:none}
#detail h3{margin:0;font-size:18px;line-height:1.1}
#detail .x{margin-left:auto;align-self:flex-start;padding:2px 9px;box-shadow:none}
#detail h4{margin:0 0 3px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
#detail .box{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
#detail ul{margin:0;padding-left:16px}#detail li{margin:1px 0}
.tools{display:flex;gap:6px;flex-wrap:wrap}.tools span{font-size:11.5px;background:#eef2f9;border:1px solid var(--line);padding:1px 8px;border-radius:99px}
#detail .mini{display:flex;gap:6px}#detail .mini input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:transparent;padding:10px;color:var(--mut);box-shadow:none}
nav button.on{color:var(--tx);font-weight:700;box-shadow:inset 0 -2px 0 var(--acc)}
.panel{display:none;flex:1;min-height:0;flex-direction:column}
.panel.on{display:flex}
#feed,#teamBox,#resBox{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 10px;border-radius:12px;background:var(--panel2);white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.msg .who{font-size:11.5px;color:var(--mut);margin-bottom:2px;font-weight:700}
.msg.user{background:#dbe8ff;align-self:flex-end;max-width:92%}
.msg.sys{background:transparent;color:var(--mut);font-size:12.5px;padding:2px 4px}
.msg.q{border:1px solid #f0c24b;background:#fff8e3}
.msg.qa{border:1px solid #9ad8bf;background:#effaf5}.msg.qa.bad{border-color:#f0a3a6;background:#fff1f1}
#compose{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
#compose .row{display:flex;gap:8px}
#target{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px}
textarea{width:100%;resize:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:64px}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex button{font-size:12px;padding:3px 9px;color:var(--mut)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card.sel{border-color:var(--acc);background:#f0f6ff}
.card .top{display:flex;align-items:center;gap:8px}
.badge{font-size:10.5px;padding:1px 6px;border-radius:99px;font-weight:800;letter-spacing:.03em}
.badge.real{background:#d9f5ea;color:var(--ok)}
.badge.sim{background:#fff0c8;color:var(--warn)}
.card .grid,.add .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card input,.card select,.add input,.add select{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.bar{height:6px;background:#e3e9f3;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.small{font-size:12px;color:var(--mut)}
.final{border-color:var(--ok);background:#f2fbf7}
details summary{cursor:pointer;color:var(--mut)}
.pre{white-space:pre-wrap;word-break:break-word;font-size:13.5px;margin-top:6px}
.add{border:1px dashed #c3cde0;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.arrows{display:flex;gap:4px}.arrows button{padding:1px 8px}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:62vh 1fr}aside{border-left:0;border-top:1px solid var(--line)}#chips{margin-left:0}#detail{width:260px}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="brand">Oficina de agentes IA <span class="tag">fase 1 · simulado</span></div>
  <div id="chips"></div>
 </header>
 <main>
  <section id="stage">
   <canvas id="cv"></canvas>
   <div id="hud">
    <div id="status">En espera</div>
    <button id="bSpin">Giro 360°</button>
    <button id="bMeet">Reunión</button>
    <button id="bView">Vista general</button>
   </div>
   <div class="hint">Arrastrá para girar · rueda para zoom · Shift+arrastrar para mover · clic en una persona para acercarte</div>
   <div id="detail"></div>
   <div id="roster"></div>
  </section>
  <aside>
   <nav id="tabs">
    <button data-t="chat" class="on">Chat</button>
    <button data-t="team">Equipo</button>
    <button data-t="res">Resultados</button>
   </nav>
   <div class="panel on" id="p-chat">
    <div id="feed"></div>
    <div id="compose">
     <div class="ex" id="ex"></div>
     <div class="row"><select id="target"></select></div>
     <textarea id="inp" placeholder="Dale una tarea al equipo…"></textarea>
     <div class="row"><button class="pri" id="send" style="flex:1">Enviar</button></div>
    </div>
   </div>
   <div class="panel" id="p-team"><div id="teamBox"></div></div>
   <div class="panel" id="p-res"><div id="resBox"></div></div>
  </aside>
 </main>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

/* ================= Proveedores (fase 2: acá se enchufan las APIs reales) ================= */
const PROVIDERS={
 claude :{label:'Claude' ,ini:'CL',color:'#e0714b',plans:['Free','Pro','Max'],mode:'real',tools:['Código','Razonamiento largo','Documentos'],office:'Estudio Claude'},
 copilot:{label:'Copilot',ini:'CP',color:'#8b5cf6',plans:['Free','Pro'],mode:'sim',tools:['VS Code','GitHub','Terminal'],office:'Dev Studio Copilot'},
 gemini :{label:'Gemini' ,ini:'GE',color:'#4a86f7',plans:['Free','Pro (estudiante)','Ultra'],mode:'sim',tools:['Búsqueda web','Multimodal','Pruebas'],office:'Laboratorio Gemini'},
 openai :{label:'ChatGPT',ini:'GP',color:'#14a37f',plans:['Free','Plus','Pro'],mode:'sim',tools:['Redacción','Ideas','Datos'],office:'Sala de ideas ChatGPT'},
 otro   :{label:'Otra IA',ini:'IA',color:'#7b8aa6',plans:['Free','Pago'],mode:'sim',tools:['General'],office:'Oficina abierta'}
};
const PO=['claude','copilot','gemini','openai','otro'];
const QUOTA=[8,40,100];
const WIN=5*3600*1000;
const LS='oficina-ia-v3';
const ROLES={
 'Backend':'Diseña la lógica del servidor, los datos y la API.',
 'Frontend':'Construye la interfaz y la experiencia de usuario.',
 'QA':'Verifica el trabajo de todos: que esté completo, coherente y que compile. Devuelve lo que falla.',
 'Investigador':'Busca y ordena información de distintas fuentes.',
 'Analista':'Compara opciones y saca conclusiones con criterio.',
 'Redactor':'Redacta y documenta con claridad.',
 'Diseñador UX':'Piensa los flujos y el aspecto de la interfaz.',
 'DevOps':'Prepara el despliegue y la infraestructura.',
 'Revisor':'Revisa y mejora el trabajo de otros.',
 'Colaborador':'Ayuda donde haga falta.'};
const isQA=a=>/^(qa|tester|verific|revisor)/i.test((a.role||'').trim());
const roleDesc=a=>ROLES[a.role]||('Cumple el rol de "'+a.role+'" dentro del equipo.');
const LOOKS=[
 {skin:'#d9a47a',hair:'#2a1d15',hs:'short',beard:1,top:'#3d5a80',kind:'sweater',pants:'#2f3a52',shoe:'#1f2430',glasses:0,hgt:1.0},
 {skin:'#f1c9a5',hair:'#8a431f',hs:'long',beard:0,top:'#5e6b4e',kind:'jacket',inner:'#efe7d6',pants:'#3b3f55',shoe:'#e8e2d6',glasses:0,hgt:0.94},
 {skin:'#c68b62',hair:'#1c1512',hs:'bun',beard:0,top:'#8fb4e8',kind:'blazer',inner:'#ffffff',pants:'#2b3042',shoe:'#2b2b33',glasses:1,hgt:0.95},
 {skin:'#f3d2b4',hair:'#c8a05a',hs:'short2',beard:0,top:'#d9a23a',kind:'sweater',pants:'#47546e',shoe:'#3a2f2a',glasses:0,hgt:1.03},
 {skin:'#8d5a3b',hair:'#15110f',hs:'curly',beard:0,top:'#c85d6a',kind:'shirt',pants:'#33384a',shoe:'#1f2430',glasses:1,hgt:1.0},
 {skin:'#e9bf98',hair:'#3a2a20',hs:'wavy',beard:0,top:'#4aa08a',kind:'hoodie',pants:'#2f3a52',shoe:'#f2f2f2',glasses:0,hgt:0.95}];
const DEFAULTS=[
 {provider:'claude',name:'Mateo',role:'Backend',planIdx:1,look:0},
 {provider:'copilot',name:'Andrea',role:'Frontend',planIdx:0,look:1},
 {provider:'gemini',name:'Sofía',role:'QA',planIdx:1,look:2},
 {provider:'openai',name:'Lucas',role:'Redactor',planIdx:0,look:3}];
const NAMEPOOL=['Valentina','Joaquín','Camila','Tomás','Martina','Nicolás','Julieta','Bruno'];
const EXAMPLES=[
 'Armá un sistema de login con usuarios y contraseñas para una web',
 'Hacé una app de lista de tareas con API y pantalla',
 'Planificá un portfolio web: estructura, textos y revisión'];

/* ================= Estado ================= */
let agents=[],running=false,t0=0,turn=0,nTeam=0,tasksDone=0,results=[],pending=null,selected=null,verdict=null;
let sampleFn=null,sampleState='comprobando';
let rot=0,spin=0,uidN=0,rotTarget=null;
let camX=14,camY=7.4,zoom=1.08,zoomT=1.08,camTx=14,camTy=7.4;

function mkAgent(c){
 const n=++uidN,li=(c.look!=null?c.look:n-1)%LOOKS.length;
 return {id:n,provider:c.provider,name:c.name,role:c.role,planIdx:c.planIdx||0,used:c.used||0,winStart:c.winStart||0,lookIdx:li,look:LOOKS[li],
  x:0,y:0,face:[0,1],path:[],pr:null,sitAfter:false,seated:true,state:'idle',progress:0,bubble:'',chat:[],askLeft:2,
  phase:Math.random()*6,away:false,cur:null,doing:'Esperando una tarea.',tasks:[],lastReply:'',wave:0}
}
function save(){try{localStorage.setItem(LS,JSON.stringify(agents.map(a=>({provider:a.provider,name:a.name,role:a.role,planIdx:a.planIdx,used:a.used,winStart:a.winStart,look:a.lookIdx}))))}catch(e){}}
function load(){let c=null;try{c=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
 agents=(c&&c.length?c:DEFAULTS).map(mkAgent)}
const prov=a=>PROVIDERS[a.provider]||PROVIDERS.otro;
const planName=a=>prov(a).plans[a.planIdx]||prov(a).plans[0];
const limit=a=>QUOTA[a.planIdx]??QUOTA[0];
function rollWin(a){if(a.winStart&&Date.now()-a.winStart>=WIN){a.used=0;a.winStart=0}}
function resetIn(a){if(!a.winStart)return '';const tot=Math.ceil(Math.max(0,WIN-(Date.now()-a.winStart))/60e3);return `${Math.floor(tot/60)}h ${String(tot%60).padStart(2,'0')}m`}
const STATE_ES={idle:'libre',working:'trabajando',done:'listo',asking:'te pregunta',blocked:'descansando'};
const STATE_COL={idle:'#9aa6bd',working:'#3b7bff',done:'#16a679',asking:'#f2b01e',blocked:'#8a93a8'};

/* ================= Geometría del edificio =================
   Fila superior (y 0..6): 4 oficinas de 7x6.  Pasillo y 6..8.
   Fila inferior (y 8..14): Oficina abierta (0..7), Sala principal (7..19), Lounge (19..28). */
const OFFS={};PO.forEach((p,i)=>{const top=i<4;OFFS[p]={p,ox:top?7*i:0,oy:top?0:8,doorY:top?6:8,chairY:top?1.65:9.65}});
function deskSeat(p,s){const o=OFFS[p],dx=o.ox+3.5,cx=o.ox+(s?5.1:1.9);
 return {room:'o:'+p,x:cx,y:o.chairY,f:[0,1],in:[[dx,7],[dx,o.doorY],[dx,o.chairY],[cx,o.chairY]]}}
function seatOf(a){const s=agents.filter(x=>x.provider===a.provider).indexOf(a);return deskSeat(a.provider,Math.max(0,s)%2)}
function visitSpot(t){const o=OFFS[t.provider],dx=o.ox+3.5,ts=seatOf(t);
 return {room:'o:'+t.provider,x:dx,y:o.chairY,f:[ts.x<dx?-1:1,0],in:[[dx,7],[dx,o.doorY],[dx,o.chairY]]}}
const MIN=[[13,7],[13,8],[13,9]];
const SEATS=(()=>{const a=[];
 [10.75,12.25,13.75,15.25].forEach(x=>a.push({x,y:9.7,f:[0,1],via:[[x,9]]}));
 [10.75,12.25].forEach(x=>a.push({x,y:12.7,f:[0,-1],via:[[8.4,9],[8.4,12.7],[x,12.7]]}));
 [13.75,15.25].forEach(x=>a.push({x,y:12.7,f:[0,-1],via:[[17.6,9],[17.6,12.7],[x,12.7]]}));
 a.push({x:9.2,y:11.2,f:[1,0],via:[[8.4,9],[8.4,11.2]]});
 a.push({x:16.8,y:11.2,f:[-1,0],via:[[17.6,9],[17.6,11.2]]});
 a.forEach(s=>{s.room='meet';s.in=[...MIN,...s.via,[s.x,s.y]]});return a})();
const LIN=[[24,7],[24,8],[24,9]];
const LOUNGE=(()=>{const a=[];
 [20.4,21.5,22.6].forEach(x=>a.push({x,y:9.4,f:[0,1],via:[[24,10.3],[x,10.3]]}));
 a.push({x:26.0,y:10.4,f:[-1,0],via:[[24,10.4]]});a.push({x:26.0,y:12.2,f:[-1,0],via:[[24,12.2]]});
 a.forEach(s=>{s.room='lounge';s.in=[...LIN,...s.via,[s.x,s.y]]});return a})();

function route(from,to){
 if(!from||from.room===to.room)return [[to.x,to.y]];
 const out=from.in.slice(0,-1).reverse(),full=[...out,...to.in];
 return full.filter((p,i)=>i===0||p[0]!==full[i-1][0]||p[1]!==full[i-1][1])}
function goTo(a,p,sit,face){return new Promise(res=>{a.seated=false;a.path=p.map(q=>q.slice());a.sitAfter=!!sit;a.faceAfter=face||null;a.pr=res;if(!p.length){a.seated=!!sit;if(face)a.face=face;a.pr=null;res()}})}
async function moveTo(a,spot,sit){const p=route(a.cur,spot);a.cur=spot;await goTo(a,p,sit,spot.f)}
function placeAtDesk(a){const s=seatOf(a);a.cur=s;a.x=s.x;a.y=s.y;a.face=s.f;a.path=[];a.seated=true;a.away=false}
const homeSpot=a=>seatOf(a);

/* ================= Escena estática ================= */
let FLOOR=[],SHAD=[],OBJ=[],PILLS=[];
function addBox(x,y,z,w,d,h,col,o){const b={x,y,z,w,d,h,col,o:o||{}};
 OBJ.push({k:()=>rd(x+w/2,y+d/2)+(b.o.dk||0),f:()=>box(b)});if(b.o.sh!==false&&h>0.25)SHAD.push(b);return b}
function addCustom(cx,cy,f,dk){OBJ.push({k:()=>rd(cx,cy)+(dk||0),f})}
const vis=(nx,ny)=>(nx*C-ny*S)+(nx*S+ny*C)>0.02;
const WALL='#f7f8fb',GLASS='#a9d6f5';
/* pared: tipo 'outer' (opaca, con corte de vista) o 'part' (base sólida + vidrio) */
function addWall(x,y,len,axis,kind,gaps,normal,o){o=o||{};
 for(let i=0;i<len;i++){const u=(axis==='x'?x:y)+i;if(gaps&&gaps.includes(u))continue;
  const seg=axis==='x'?{x:u,y:y-0.1,w:1,d:0.2}:{x:x-0.1,y:u,w:0.2,d:1};
  OBJ.push({k:()=>rd(seg.x+seg.w/2,seg.y+seg.d/2),f:()=>{
   if(kind==='part'){
    box({x:seg.x,y:seg.y,z:0,w:seg.w,d:seg.d,h:0.9,col:o.col||'#e4e9f2',o:{}});
    box({x:seg.x,y:seg.y,z:0.9,w:seg.w,d:seg.d,h:1.5,col:GLASS,o:{al:0.28,edge:'rgba(80,130,180,.5)'}});
    box({x:seg.x,y:seg.y,z:2.4,w:seg.w,d:seg.d,h:0.08,col:o.trim||'#c9d2e2',o:{}});return}
   let h=2.6;if(normal){const rx=normal[0]*C-normal[1]*S,ry=normal[0]*S+normal[1]*C;if(rx+ry>0.12)h=0.5}
   box({x:seg.x,y:seg.y,z:0,w:seg.w,d:seg.d,h,col:o.col||WALL,o:{}});
   if(h>2&&(i%3===1))box({x:seg.x-(axis==='y'?0.03:0),y:seg.y-(axis==='x'?0.03:0),z:0.9,w:seg.w+(axis==='y'?0.06:0),d:seg.d+(axis==='x'?0.06:0),h:1.1,col:'#a8d3f2',o:{al:.9}})}})}

const cv=$('#cv'),ctx=cv.getContext('2d');
let W=800,H=600,TW=20,TH=10,ZH=22,OX=0,OY=0,C=1,S=0,baseTW=20,axT=0.5,ayT=0.46,ax=0.5,ay=0.46;
function hexRGB(h){const n=parseInt(h.slice(1),16);return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255)}
function resize(){const r=cv.getBoundingClientRect();const d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
function setCam(){C=Math.cos(rot);S=Math.sin(rot);baseTW=Math.min(W/46,H/27);TW=baseTW*zoom;TH=TW/2;ZH=TW*1.12;OX=W*ax;OY=H*ay}
function proj(x,y,z){const dx=x-camX,dy=y-camY;const rx=dx*C-dy*S,ry=dx*S+dy*C;return {x:OX+(rx-ry)*TW,y:OY+(rx+ry)*TH-z*ZH}}
function rd(x,y){const dx=x-camX,dy=y-camY;return (dx*C-dy*S)+(dx*S+dy*C)}
function shade(h,f){const n=parseInt(h.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.min(255,r*f)|0;g=Math.min(255,g*f)|0;b=Math.min(255,b*f)|0;return `rgb(${r},${g},${b})`}
function poly(p,fill,stroke){ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function box(b){const {x,y,z,w,d,h,col,o}=b;const al=o.al!=null?o.al:1;ctx.globalAlpha=al;const edge=o.edge||'rgba(30,40,70,.16)';
 const sides=[[1,0,[x+w,y],[x+w,y+d]],[-1,0,[x,y],[x,y+d]],[0,1,[x,y+d],[x+w,y+d]],[0,-1,[x,y],[x+w,y]]];
 for(const [nx,ny,a,c2] of sides){const rx=nx*C-ny*S,ry=nx*S+ny*C;if(rx+ry<=0.0001)continue;
  poly([proj(a[0],a[1],z),proj(c2[0],c2[1],z),proj(c2[0],c2[1],z+h),proj(a[0],a[1],z+h)],shade(col,(rx-ry)>0?0.72:0.88),edge)}
 if(!o.noTop)poly([proj(x,y,z+h),proj(x+w,y,z+h),proj(x+w,y+d,z+h),proj(x,y+d,z+h)],shade(col,1.08),edge);ctx.globalAlpha=1}
function blob(x,y,r,c1,c2){const g=ctx.createRadialGradient(x-r*0.3,y-r*0.35,r*0.1,x,y,r);g.addColorStop(0,c2);g.addColorStop(1,c1);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=g;ctx.fill()}
function quadY(py,x0,x1,z0,z1,col){poly([proj(x0,py,z0),proj(x1,py,z0),proj(x1,py,z1),proj(x0,py,z1)],col)}
function quadX(px,y0,y1,z0,z1,col){poly([proj(px,y0,z0),proj(px,y1,z0),proj(px,y1,z1),proj(px,y0,z1)],col)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

   Cada articulación vive en coordenadas del mundo (u adelante, v lateral, z altura)
   y se proyecta con la misma cámara que el edificio: al girar la vista el cuerpo gira de verdad. */
function smooth(g,pts){g.beginPath();const n=pts.length;g.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2);
 for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}g.closePath()}
function limb(g,p,q,w,col,hi){g.lineCap='round';g.strokeStyle='rgba(15,20,40,.32)';g.lineWidth=w+1.6;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke();

 if(hi){g.strokeStyle='rgba(255,255,255,.16)';g.lineWidth=Math.max(1,w*0.28);g.beginPath();g.moveTo(p.x-w*0.18,p.y);g.lineTo(q.x-w*0.18,q.y);g.stroke()}}

/* ================= Adaptadores (fase 2: se enchufan APIs reales acá) ================= */
function persona(a){return `Sos ${a.name}, un agente de IA (motor ${prov(a).label}) con el rol de "${a.role}" dentro de una oficina de agentes que trabaja en equipo. Respondé siempre en español, claro y concreto.`+(isQA(a)?' Todavía no podés ejecutar ni compilar código: revisás por lectura que todo esté completo, que las piezas encajen entre sí y que no haya errores evidentes de sintaxis o lógica.':'')}
function canned(a,msgs){
 const all=msgs.map(m=>m.content).join(' ');
 if(/Ronda: (\d)/.test(all)){const r=+all.match(/Ronda: (\d)/)[1],nm=((all.match(/Nombres válidos: ([^\n.]+)/)||[])[1]||'').split(',')[0].trim()||'el primer agente';
  return r<2?`RECHAZADO: ${nm}: falta contemplar un caso límite (entrada vacía) y dejar explícitos los supuestos.`:'APROBADO: todo es coherente y las piezas encajan.'}
 const task=((all.match(/Tarea del usuario: ([^\n]*)/)||[])[1]||'la tarea').slice(0,90);
 if(/Feedback de QA/.test(all))return `[Respuesta de ejemplo, sin IA conectada]\nCorregido: ahora manejo el caso límite que marcó QA y dejé escritos los supuestos para "${task}".`;
 return `[Respuesta de ejemplo, sin IA conectada]\nComo ${a.role}, sobre "${task}": definí los puntos clave, los ordené por prioridad y dejé listo lo necesario para el siguiente compañero.`}
const ADAPTERS={
 async sample(a,msgs,sys){
  if(!sampleFn){await sleep(1800+Math.random()*1500);return canned(a,msgs)}
  const m=[{role:'user',content:sys+'\n\n'+msgs[0].content},...msgs.slice(1)];
  try{const r=await sampleFn(m,{cache:false});return (r.text||'').trim()}
  catch(e){if(e&&e.code==='not_granted'){sampleFn=null;sampleState='sin permiso';renderChips();addMsg('sys','','No hay permiso para usar Claude desde la página: sigo con respuestas de ejemplo.');return canned(a,msgs)}
   if(e&&e.code==='rate_limited')throw new Error('Se alcanzó el límite de uso de Claude. Probá en unos minutos.');throw e}},
 async api(){throw new Error('Conexión por API: se agrega en la fase 2')}
};
async function callAgent(a,msgs,sys){
 rollWin(a);if(a.used>=limit(a)){const e=new Error('Sin cupo');e.quota=true;throw e}
 if(!a.winStart)a.winStart=Date.now();a.used++;save();renderTeam();
 return ADAPTERS.sample(a,msgs,sys||persona(a));
}

const short=(t,n)=>{t=t.replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n-1)+'…':t};
const summary=t=>{const s=t.replace(/\[Respuesta de ejemplo[^\]]*\]\s*/,'').replace(/\s+/g,' ').trim();const k=s.search(/[.!?]\s/);return k>20&&k<110?s.slice(0,k+1):(s.length>100?s.slice(0,98)+'…':s)};
function buildPrompt(a,task,outs){
 const prev=outs.map(o=>`### ${o.agent.name} (${o.agent.role})\n${o.text}`).join('\n\n');
 return `Tarea del usuario: ${task}\n`+(prev?`\nTrabajo previo del equipo:\n${prev}\n`:'')+
 `\nHacé SOLO tu parte según tu rol de "${a.role}", en español y conciso (máximo ~150 palabras). Si tu rol es técnico, entregá código breve y comentado que encaje con lo que ya hicieron tus compañeros. Si te falta un dato imprescindible, respondé únicamente con UNA línea que empiece con "PREGUNTA:" seguida de la pregunta.`}
function waitAnswer(a,q){return new Promise(res=>{a.state='asking';a.bubble='❓ '+q;a.doing='Te hizo una pregunta y espera tu respuesta.';const m=addMsg('q','❓ '+a.name+' te pregunta',q);showTab('chat');
 $('#inp').placeholder='Respondele a '+a.name+'…';$('#inp').focus();
 pending=ans=>{$('#inp').placeholder='Dale una tarea al equipo…';a.bubble='';a.state='working';a.doing='Retomó el trabajo con tu respuesta.';res(ans)}})}
async function work(a,task,outs,extra){
 const hist=[{role:'user',content:buildPrompt(a,task,outs)+(extra||'')}];a.askLeft=2;
 for(;;){const txt=await callAgent(a,hist);const m=txt.match(/^\s*PREGUNTA:\s*([\s\S]+)/i);
  if(m&&a.askLeft>0){a.askLeft--;const ans=await waitAnswer(a,m[1].trim().split('\n')[0]);
   hist.push({role:'assistant',content:txt},{role:'user',content:'Respuesta del usuario: '+ans+'\nAhora hacé tu parte; no hagas más preguntas.'});continue}
  return m?m[1].trim():txt}}
async function moveTo(a,spot,sit){if(a._mv)await a._mv;const p=route(a.cur,spot);a.cur=spot;const pr=goTo(a,p,sit,spot.f);a._mv=pr;await pr;if(a._mv===pr)a._mv=null}

 addMsg('sys','','🏢 Reunión en la sala principal');
 await Promise.all(parts.map((a,i)=>moveTo(a,SEATS[i%SEATS.length],true)));
 for(const r of results){r.agent.bubble=summary(r.text);r.agent.wave=0;addMsg('sys','','📣 '+r.agent.name+': '+summary(r.text));await sleep(2600);r.agent.bubble=''}
 await Promise.all(parts.map(a=>moveTo(a,homeSpot(a),true)));
 renderResults();showTab('res')}
function parseVerdict(txt,prods){
 if(/RECHAZADO/i.test(txt)){const m=txt.match(/RECHAZADO:?\s*([^:\n]+?)\s*:\s*([\s\S]+)/i);const nameStr=m?m[1]:txt;
  const who=prods.find(p=>nameStr.toLowerCase().includes(p.name.toLowerCase()))||prods[prods.length-1];return {ok:false,who,reason:(m?m[2]:txt).trim().split('\n')[0]}}
 return {ok:true,reason:txt.replace(/^\s*APROBADO:?\s*/i,'').trim()}}
async function verifyLoop(task,qa,prods){
 let rounds=0;
 for(;;){
  rounds++;qa.state='working';qa.progress=0;qa.doing=`Verificando el trabajo de ${prods.map(p=>p.name).join(', ')} (ronda ${rounds}).`;
  addMsg('sys','',`🔎 ${qa.name} (${qa.role}) revisa el trabajo de todos · ronda ${rounds}.`);
  const outs=results.filter(r=>r.kind!=='qa'&&prods.includes(r.agent));
  const lastOut={};outs.forEach(r=>lastOut[r.agent.id]=r);
  const body=Object.values(lastOut).map(o=>`### ${o.agent.name} (${o.agent.role})\n${o.text}`).join('\n\n');
  const pr=`Tarea del usuario: ${task}\n\nTrabajo del equipo:\n${body}\n\nRonda: ${rounds}\nNombres válidos: ${prods.map(p=>p.name).join(', ')}.\n\nVerificá que el conjunto esté completo, que las piezas encajen entre sí (por ejemplo que el frontend use lo que expone el backend) y que no haya errores evidentes que impidan que compile o funcione. Respondé SOLO con una de estas dos formas: "APROBADO: <una frase>" o "RECHAZADO: <Nombre del agente>: <motivo concreto en una frase>".`;
  let txt;try{txt=await callAgent(qa,[{role:'user',content:pr}])}catch(e){qa.state='done';throw e}
  const v=parseVerdict(txt,prods);
  if(v.ok||rounds>=3){qa.state='done';qa.progress=1;verdict={ok:v.ok,text:v.ok?v.reason:('Quedó pendiente: '+v.reason),agent:qa,rounds};
   addMsg('qa'+(v.ok?'':' bad'),`${qa.name} · QA`,(v.ok?'✔ APROBADO: ':'✖ Sigue observado: ')+v.reason);
   qa.tasks.forEach(t=>{if(t.st==='en curso')t.st=v.ok?'hecho':'rechazado'});return v}
  addMsg('qa bad',`${qa.name} · QA`,`✖ RECHAZADO (${v.who.name}): ${v.reason}`);
  qa.state='done';qa.doing=`Encontró un problema en el trabajo de ${v.who.name}.`;
  await visit(qa,v.who,'Encontré un problema: '+short(v.reason,80),'Entendido, lo corrijo.');
  const bad=v.who;bad.state='working';bad.progress=0;bad.doing=`Corrigiendo lo que marcó ${qa.name}: ${short(v.reason,70)}`;
  const mine=lastOut[bad.id];bad.tasks.push({text:'Corrección: '+short(v.reason,50),st:'en curso'});
  let fixed;try{fixed=await work(bad,task,results.filter(r=>r.kind!=='qa'&&r.agent!==bad),`\n\nTu trabajo anterior:\n${mine?mine.text:''}\n\nFeedback de QA (${qa.name}): ${v.reason}\nCorregí lo señalado y devolvé tu parte completa y actualizada.`)}
  catch(e){if(e.quota){bad.state='blocked';sendToLounge(bad);verdict={ok:false,text:'No se pudo corregir: sin cupo.',agent:qa,rounds};return {ok:false}}throw e}
  bad.state='done';bad.progress=1;bad.doing='Entregó la corrección.';bad.tasks.forEach(t=>{if(t.st==='en curso')t.st='corregido'});
  results.push({agent:bad,text:fixed,kind:'fix'});addMsg('agent',`${bad.name} · ${bad.role} (corrección)`,fixed);
  await visit(bad,qa,'🔧 Ya lo corregí: '+summary(fixed).replace(/^Corregido:\s*/i,'').slice(0,60),'Lo reviso de nuevo.');
 }}
async function runTask(task){
 running=true;t0=Date.now();results=[];verdict=null;renderResults();const team=agents.slice();$('#send').disabled=true;
 for(const a of team){rollWin(a);if(a.state==='blocked'&&a.used<limit(a)){a.state='idle';await returnFromLounge(a)}a.tasks.push({text:short(task,48),st:'en curso'})}
 let qa=team.find(isQA);const prods=team.filter(x=>x!==qa);nTeam=prods.length+(qa?1:0);
 try{
  for(let i=0;i<prods.length;i++){
   turn=i+1;const a=prods[i];
   if(a.state==='blocked'){continue}
   a.state='working';a.progress=0;a.bubble='';a.doing=`Trabajando en: «${short(task,60)}»`;addMsg('sys','',`▶ ${a.name} (${a.role}) se puso a trabajar en la oficina de ${prov(a).label}.`);
   let text;
   try{text=await work(a,task,results.filter(r=>r.kind!=='qa'))}
   catch(e){if(e.quota){a.state='blocked';a.bubble='Sin cupo';a.tasks.forEach(t=>{if(t.st==='en curso')t.st='sin cupo'});addMsg('sys','',`⛔ ${a.name} se quedó sin cupo del plan ${planName(a)} (se reinicia en ${resetIn(a)}). Se va al lounge a descansar.`);renderTeam();sendToLounge(a);continue}throw e}
   a.state='done';a.progress=1;a.doing='Entregó su parte: '+summary(text).slice(0,90);a.tasks.forEach(t=>{if(t.st==='en curso')t.st='hecho'});
   results.push({agent:a,text,kind:'work'});addMsg('agent',`${a.name} · ${a.role}`,text);renderTeam();
   const next=prods.slice(i+1).find(x=>x.state!=='blocked')||(qa&&qa.state!=='blocked'?qa:null);
   if(next)await visit(a,next,'📨 Te paso lo mío: '+summary(text).slice(0,60),next===qa?'Recibido, lo reviso.':'Recibido ✓');
  }
  if(qa){rollWin(qa);if(qa.state==='blocked'||qa.used>=limit(qa)){addMsg('sys','',`${qa.name} (QA) no tiene cupo: la entrega sale sin verificar.`)}
   else if(results.length){turn=nTeam;await verifyLoop(task,qa,prods.filter(p=>results.some(r=>r.agent===p)))}}
  if(results.length){await meeting();tasksDone++}else addMsg('sys','','Nadie pudo trabajar (sin cupo o error).');
 }catch(e){addMsg('sys','','⚠ '+(e&&e.message||'Error inesperado'))}
 finally{running=false;pending=null;$('#send').disabled=false;agents.forEach(a=>{if(a.state!=='blocked'){a.state='idle';a.bubble='';a.doing='Esperando una tarea.'}});renderTeam();renderChips();renderRoster()}
}
async function directChat(a,text){
 running=true;$('#send').disabled=true;a.chat.push({role:'user',content:text});a.state='working';a.progress=0;a.doing='Te está respondiendo.';a.wave=0;
 try{const r=await callAgent(a,a.chat,persona(a));a.chat.push({role:'assistant',content:r});addMsg('agent',a.name,r);a.lastReply=r;a.bubble=summary(r).slice(0,80);setTimeout(()=>{a.bubble=''},4000)}
 catch(e){addMsg('sys','',e.quota?`⛔ ${a.name} no tiene más cupo en esta ventana (se reinicia en ${resetIn(a)}).`:'⚠ '+(e.message||'Error'));a.chat.pop()}
 finally{a.state=a.state==='blocked'?'blocked':'idle';if(a.state==='idle'){a.progress=0;a.doing='Esperando una tarea.'}running=false;$('#send').disabled=false;renderTeam();updateDetail()}
}
async function onSend(){
 const inp=$('#inp'),text=inp.value.trim();if(!text)return;inp.value='';
 if(pending){addMsg('user','Vos',text);const p=pending;pending=null;p(text);return}
 if(running){addMsg('sys','','Hay una tarea en curso, esperá a que termine.');return}
 addMsg('user','Vos',text);const t=$('#target').value;
 if(t==='team')await runTask(text);else{const a=agents.find(x=>'a'+x.id===t);if(a)await directChat(a,text)}
}
$('#send').onclick=onSend;
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();onSend()}});

/* ================= Arranque ================= */
setInterval(()=>{const s=$('#status');
 if(running&&t0){const sec=Math.floor((Date.now()-t0)/1000);s.textContent=`Trabajando · ${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')} · ${Math.min(turn,nTeam)} de ${nTeam}`;s.className='on'}
 else{s.className='';s.textContent=`En espera · ${agents.filter(a=>a.state!=='blocked').length} de ${agents.length} disponibles`}
 updateRoster();updateDetail()},500);
setInterval(()=>{agents.forEach(a=>{if(a.state==='blocked'){rollWin(a);if(a.used<limit(a)&&!running){a.state='idle';returnFromLounge(a);addMsg('sys','',`🌴 ${a.name} volvió de descansar: su cupo se reinició.`);renderTeam();renderRoster()}}})},15000);
load();agents.forEach(placeAtDesk);buildStatic();fillTarget();renderTeam();renderResults();renderChips();renderRoster();
addMsg('sys','','Cada IA tiene su oficina. Dale una tarea al equipo o hacé clic en una persona para acercarte y hablarle. Si alguien necesita un dato, te lo pregunta acá.');
new ResizeObserver(resize).observe(cv);resize();requestAnimationFrame(frame);
window._office={setRot:v=>{rot=v;rotTarget=null},setZoom:v=>{zoom=zoomT=v},agents:()=>agents,select:i=>selectAgent(agents[i]),deselect,sample:()=>sampleFn};
try{if(window.claude&&claude.use){claude.use('sample').then(s=>{sampleFn=s||null;sampleState=s?'disponible':'no disponible';renderChips()}).catch(()=>{sampleState='no disponible';renderChips()})}else{sampleState='no disponible';renderChips()}}catch(e){sampleState='no disponible';renderChips()}
})();
</script>
