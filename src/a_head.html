<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina de agentes IA</title>
<style>
/* tema oscuro por defecto; body.light vuelve al claro */
:root{--bg:#0b1020;--panel:#141a2c;--panel2:#1a2138;--line:#2a3350;--tx:#e7ecf8;--mut:#8f9bb8;--acc:#5b8cff;--ok:#25c294;--warn:#e0a526;--bad:#ff6369;
--glass:rgba(18,24,42,.92);--glass2:rgba(20,27,48,.96);--btn:#1b233b;--inp:#10162a;--accbg:#1e2c55;--sh:rgba(0,0,0,.5);--sel:#1b2a52;--hv:#3d5290;--port:#232c49;--user:#25427e;
--qbg:#2e2713;--qbd:#7a6420;--qabg:#10281f;--qabd:#1f6a4e;--qbbg:#2d1519;--qbbd:#7a2f36;--okbg:#10372b;--wbg:#3a2f12;--fin:#10281f;--bar:#2a3350;--dash:#34406a;--stage:linear-gradient(#070b17,#0d1426 55%,#0a1517)}
body.light{--bg:#eef2f8;--panel:#ffffff;--panel2:#f4f7fb;--line:#dde4ef;--tx:#1b2438;--mut:#6b7790;--acc:#3b7bff;--ok:#16a679;--warn:#c98a00;--bad:#e5484d;
--glass:rgba(255,255,255,.94);--glass2:rgba(255,255,255,.97);--btn:#ffffff;--inp:#ffffff;--accbg:#e8f0ff;--sh:rgba(30,50,90,.2);--sel:#f2f7ff;--hv:#b9cdf5;--port:#e8eefb;--user:#dbe8ff;
--qbg:#fff8e3;--qbd:#f0c24b;--qabg:#effaf5;--qabd:#9ad8bf;--qbbg:#fff1f1;--qbbd:#f0a3a6;--okbg:#d9f5ea;--wbg:#fff0c8;--fin:#f2fbf7;--bar:#e3e9f3;--dash:#c3cde0;--stage:linear-gradient(#cfe3f7,#eaf3fb 55%,#e4f1df)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em}
.tag{font-weight:600;font-size:11.5px;color:var(--acc);margin-left:8px;padding:2px 8px;background:var(--accbg);border-radius:99px}
#chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.chip b{color:var(--tx)}
main{display:grid;grid-template-columns:262px 1fr 390px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;background:var(--stage)}
canvas#cv{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#cv:active{cursor:grabbing}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
#status{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px var(--sh)}
#status.on{color:var(--acc)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--btn);border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer;box-shadow:0 1px 4px var(--sh)}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;border-radius:10px}
button.on{border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:var(--glass2);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px var(--sh);padding:6px;display:none;flex-direction:column;gap:2px;z-index:5}
.menu.on{display:flex}
.menu button{border:0;box-shadow:none;border-radius:10px;text-align:left;background:transparent;padding:8px 10px}
.menu button:hover{background:var(--panel2)}
.menu small{display:block;color:var(--mut);font-size:11.5px}
.hint{position:absolute;bottom:12px;left:12px;font-size:12px;color:var(--mut);background:var(--glass);padding:2px 8px;border-radius:99px;pointer-events:none}
/* barra lateral (estilo panel de trabajo) */
#side{display:flex;flex-direction:column;min-height:0;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 10px 14px;gap:2px}
.sbrand{display:flex;align-items:center;gap:9px;padding:2px 6px 10px;font-size:14px;letter-spacing:.02em}
.slogo{width:28px;height:28px;border-radius:8px;background:var(--accbg);display:grid;place-items:center;font-size:15px}
button.snew{width:100%;border-radius:12px;background:#c9e86a;color:#1c2608;border:0;font-weight:800;padding:10px;margin:0 0 10px;box-shadow:0 2px 10px rgba(160,200,60,.25)}
button.snew:hover{filter:brightness(1.07)}
.sitem{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;color:var(--tx)}
.sitem:hover{background:var(--panel2)}.sitem.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--hv)}
.sico{width:20px;text-align:center;font-size:14px;flex:none}
.stx{flex:1;min-width:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbd{flex:none;min-width:20px;text-align:center;font-size:11px;font-weight:800;color:#fff;border-radius:99px;padding:1px 7px;display:none}
.sbd.on{display:inline-block}.sbd.red{background:#ff4d4f}.sbd.blue{background:#5b4bf0}
.shead{margin:14px 6px 5px;font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--mut);text-transform:uppercase}
.dsq{width:10px;height:10px;border-radius:3px;flex:none;margin:0 5px}
.sag{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:10px;cursor:pointer}
.sag:hover{background:var(--panel2)}.sag.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--hv)}
.sag canvas{width:34px;height:34px;border-radius:50%;background:var(--port);flex:none;border:2px solid transparent}
.sag.ask canvas{border-color:#ff4d4f}
.sag .nm{font-weight:700;font-size:13.5px;line-height:1.15;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sag .tk{font-size:11px;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:4px}
.sag .sb{font-size:11.5px;color:var(--mut);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.sag.ask .sb{color:#ff6369;font-weight:700}
.sag .mid{min-width:0}
/* (barra inferior retirada) */
#roster{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;align-items:stretch}
.rtasks{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:64px;background:var(--glass2);border-radius:14px;padding:4px 10px;box-shadow:0 2px 8px var(--sh)}
.rtasks b{font-size:20px;line-height:1}.rtasks span{font-size:11px;color:var(--mut)}
.rc{flex:none;display:flex;gap:8px;align-items:center;background:var(--glass2);border-radius:14px;padding:6px 12px 6px 6px;border:2px solid transparent;cursor:pointer;min-width:158px;box-shadow:0 2px 8px var(--sh);position:relative}
.rc:hover{border-color:var(--hv)}.rc.sel{border-color:var(--acc);background:var(--sel)}
.rc canvas{width:46px;height:46px;border-radius:50%;background:var(--port);flex:none}
.rc .nm{font-weight:800;line-height:1.1}.rc .ro{font-size:11.5px;color:var(--mut);line-height:1.2}
.rc .ln{display:flex;align-items:center;gap:6px;margin-top:3px}
.pchip{font-size:10px;font-weight:800;color:#fff;border-radius:6px;padding:1px 6px;letter-spacing:.02em}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}
.rc .tk{font-size:11px;color:var(--mut)}
/* tarjeta de detalle */
#detail{position:absolute;top:54px;right:12px;width:318px;max-height:calc(100% - 80px);overflow:auto;background:var(--glass2);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px var(--sh);padding:14px;display:none;flex-direction:column;gap:10px}
#detail.on{display:flex}
#detail .hd{display:flex;gap:10px;align-items:center}
#detail .hd canvas{width:58px;height:58px;border-radius:50%;background:var(--port);flex:none}
#detail h3{margin:0;font-size:18px;line-height:1.1}
#detail .x{margin-left:auto;align-self:flex-start;padding:2px 9px;box-shadow:none}
#detail h4{margin:0 0 3px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
#detail .box{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px}
#detail ul{margin:0;padding-left:16px}#detail li{margin:1px 0}
.tools{display:flex;gap:6px;flex-wrap:wrap}.tools span{font-size:11.5px;background:var(--panel2);border:1px solid var(--line);padding:1px 8px;border-radius:99px}
#detail .mini{display:flex;gap:6px}#detail .mini input{flex:1;background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0}
.mrow{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:10px;cursor:pointer}
.mrow:hover{background:var(--panel2)}
.mrow canvas{width:34px;height:34px;border-radius:50%;background:var(--port);flex:none}
.mrow .nm{font-weight:700;line-height:1.15}.mrow .ro{font-size:11.5px;color:var(--mut);line-height:1.2}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:transparent;padding:10px;color:var(--mut);box-shadow:none}
nav button.on{color:var(--tx);font-weight:700;box-shadow:inset 0 -2px 0 var(--acc)}
.panel{display:none;flex:1;min-height:0;flex-direction:column}
.panel.on{display:flex}
#feed,#teamBox,#resBox{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 10px;border-radius:12px;background:var(--panel2);white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.msg .who{font-size:11.5px;color:var(--mut);margin-bottom:2px;font-weight:700}
.msg.user{background:var(--user);align-self:flex-end;max-width:92%}
.msg.sys{background:transparent;color:var(--mut);font-size:12.5px;padding:2px 4px}
.msg.q{border:1px solid var(--qbd);background:var(--qbg)}
.msg.qa{border:1px solid var(--qabd);background:var(--qabg)}.msg.qa.bad{border-color:var(--qbbd);background:var(--qbbg)}
#compose{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
#compose .row{display:flex;gap:8px}
#target{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px}
textarea{width:100%;resize:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:64px}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex button{font-size:12px;padding:3px 9px;color:var(--mut)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card.sel{border-color:var(--acc);background:var(--sel)}
.card .top{display:flex;align-items:center;gap:8px}
.badge{font-size:10.5px;padding:1px 6px;border-radius:99px;font-weight:800;letter-spacing:.03em}
.badge.real{background:var(--okbg);color:var(--ok)}
.badge.sim{background:var(--wbg);color:var(--warn)}
.card .grid,.add .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card input,.card select,.add input,.add select{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.bar{height:6px;background:var(--bar);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.small{font-size:12px;color:var(--mut)}
.final{border-color:var(--ok);background:var(--fin)}
details summary{cursor:pointer;color:var(--mut)}
.pre{white-space:pre-wrap;word-break:break-word;font-size:13.5px;margin-top:6px}
.add{border:1px dashed var(--dash);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.arrows{display:flex;gap:4px}.arrows button{padding:1px 8px}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:62vh 1fr}#side{display:none}aside{border-left:0;border-top:1px solid var(--line)}#chips{margin-left:0}#detail{width:260px}}
main.noaside{grid-template-columns:262px 1fr}main.noaside aside{display:none}
nav button#bClose{flex:none;width:44px;font-size:16px;color:var(--mut)}nav button#bClose:hover{color:var(--bad)}
.rname{font-size:18px;font-weight:800;width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:0 0 2px;color:var(--tx)}
.rname:focus{outline:0;border-bottom-color:var(--acc)}
.looks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.looks canvas{width:38px;height:38px;border-radius:50%;background:var(--port);cursor:pointer;border:2px solid transparent}
.looks canvas:hover{border-color:var(--hv)}.looks canvas.on{border-color:var(--acc)}
#detail .nmin{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
#setBox{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.card input[type=password],.card input[type=text],.add input[type=text]{width:100%}
.card .stack{display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="brand">Oficina de agentes IA <span class="tag">fase 2 · conecta a tu PC</span></div>
  <div id="chips"></div>
 </header>
 <main id="mainGrid">
  <div id="side"></div>
  <section id="stage">
   <canvas id="cv"></canvas>
   <div id="hud">
    <div id="status">En espera</div>
    <button id="bSpin">Giro 360°</button>
    <button id="bMeet">Reunión</button>
    <button id="bView">Vista general</button>
    <div class="menuwrap">
     <button id="bSummon">📣 Convocar ▾</button>
     <div class="menu" id="summonMenu">
      <button data-m="all" data-w="meet">Todos a la sala de reuniones<small>Se juntan en la sala principal y ahí les contás el proyecto.</small></button>
      <button data-m="reps" data-w="meet">Un representante por oficina → sala de reuniones<small>Viene uno de cada oficina y después le cuenta al resto.</small></button>
      <button data-m="all" data-w="office">Todos a mi oficina<small>Cada agente viene a escucharte antes de empezar.</small></button>
      <button data-m="reps" data-w="office">Un representante por oficina → mi oficina<small>Viene uno de cada oficina y después le cuenta al resto.</small></button>
      <button data-m="back" id="mBack">↩ Que vuelvan a sus oficinas</button>
     </div>
    </div>
    <button id="bAway">🧑‍💼 Estoy presente</button>
    <button id="bLife" title="Si no tienen tareas, hacen su vida: café, cocina, pizarra…">☕ Vida libre</button>
    <button id="bChat" style="display:none" title="Abrir el chat">💬 Chat</button>
    <button id="bTheme" title="Cambiar tema">🌙 Oscuro</button>
   </div>
   <div class="hint">Arrastrá para girar · rueda para zoom · Shift+arrastrar para mover · clic en una persona o en una oficina para acercarte</div>
   <div id="detail"></div>
  </section>
  <aside>
   <nav id="tabs">
    <button data-t="chat" class="on">Chat</button>
    <button data-t="team">Equipo</button>
    <button data-t="res">Resultados</button>
    <button data-t="set">Ajustes</button>
    <button id="bClose" title="Cerrar el chat">✕</button>
   </nav>
   <div class="panel on" id="p-chat">
    <div id="feed"></div>
    <div id="compose">
     <div class="ex" id="ex"></div>
     <div class="row"><select id="target"></select></div>
     <textarea id="inp" placeholder="Dale una tarea al equipo…"></textarea>
     <div class="row"><button class="pri" id="send" style="flex:1">Enviar</button></div>
    </div>
   </div>
   <div class="panel" id="p-team"><div id="teamBox"></div></div>
   <div class="panel" id="p-res"><div id="resBox"></div></div>
   <div class="panel" id="p-set"><div id="setBox"></div></div>
  </aside>
 </main>
</div>
<script>
